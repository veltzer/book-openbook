# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). Every dep_auto entry
# listed here must exist: rsconstruct rejects a missing one at config load.
# Repos still on config/*.py keep a dep_inputs override in their local
# overlay until converted.
[processor.tera]
dep_auto = [
  "config/project.lua",
  "config/personal.lua",
  "config/version.lua",
]
# out/drivers holds the build-generated driver templates (see the
# driver-generation section below); nothing under it is committed.
src_dirs = ["tera.templates", "out/drivers"]
dep_inputs = ["config/project.lua", "config/personal.lua", "config/version.lua"]

[processor.ruff]
src_dirs = ["scripts", "config", "tests"]

[processor.pylint]
src_dirs = ["scripts", "config", "tests"]

[processor.mypy]
src_dirs = ["scripts", "config", "tests"]

# golden tests pinning the driver generator (tests/test_drivers.py)
[processor.pytest]
src_dirs = ["tests"]

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.shellcheck]
src_dirs = ["scripts", "docs", "config"]

# ─── lua ─────────────────────────────────────────────────────────────────────

[processor.luacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_files = [".rumdl.toml", "pyproject.toml", "rsconstruct.toml"]

# ─── derived song metadata ───────────────────────────────────────────────────

# One out/derived/<book>/<song>.ly.toml per song, derived from the TOML
# front matter of src/<book>/<song>.ly.tera. The driver templates
# load these via load_toml, so this must run before the tera renders —
# the exact output-path match gives rsconstruct that ordering. Without
# this step a cold checkout cannot render any song or book.
[processor.generator.derive_metadata]
command = "python"
args = ["-m", "scripts.derive_metadata"]
src_dirs = ["src"]
src_extensions = [".tera"]
src_exclude_dirs = ["src/include"]
output_dir = "out/derived"
output_extension = "toml"
dep_inputs = ["scripts/derive_metadata.py", "scripts/drivers.py"]

# ─── driver templates ────────────────────────────────────────────────────────

# tera cannot include dynamic paths, so every output needs its own driver
# template wrapping the song file(s); scripts/drivers.py generates them
# from the weave master (src/include/common.ly.weave) so that git holds
# exactly ONE file per song. A song driver depends on the song's derived
# metadata toml (drivers depend only on front matter, not the tune body),
# which both orders derivation before the driver and, transitively,
# before the tera render that load_toml's it — cold builds work in one
# pass via rsconstruct's virtual-file discovery loop. The output path
# nests out/tera/src under out/drivers so the tera processor (src_dirs
# includes out/drivers) renders each driver to the out/tera path the
# books and opt-in song processors expect.
[processor.generator.song_drivers]
command = "python"
args = ["-m", "scripts.drivers", "songs"]
src_dirs = ["out/derived"]
src_extensions = [".toml"]
output_dir = "out/drivers/out/tera/src"
output_extension = "tera"
dep_inputs = ["scripts/drivers.py", "src/include/common.ly.weave"]

# One driver per book, splicing all of the book's songs; the glob over
# the derived tomls grows across discovery passes, so the product picks
# up every song even on a cold build.
[processor.explicit.openbook_driver]
command = "python"
args = ["-m", "scripts.drivers", "book"]
inputs = ["src/include/common.ly.weave", "scripts/drivers.py"]
input_globs = ["out/derived/openbook/**/*.ly.toml"]
output_files = ["out/drivers/out/tera/books/openbook.ly.tera"]

[processor.explicit.israeli_driver]
command = "python"
args = ["-m", "scripts.drivers", "book"]
inputs = ["src/include/common.ly.weave", "scripts/drivers.py"]
input_globs = ["out/derived/israeli/**/*.ly.toml"]
output_files = ["out/drivers/out/tera/books/israeli.ly.tera"]

[processor.explicit.drumming_driver]
command = "python"
args = ["-m", "scripts.drivers", "book"]
inputs = ["src/include/common.ly.weave", "scripts/drivers.py"]
input_globs = ["out/derived/drumming/**/*.ly.toml"]
output_files = ["out/drivers/out/tera/books/drumming.ly.tera"]

[processor.explicit.rockbook_driver]
command = "python"
args = ["-m", "scripts.drivers", "book"]
inputs = ["src/include/common.ly.weave", "scripts/drivers.py"]
input_globs = ["out/derived/rockbook/**/*.ly.toml"]
output_files = ["out/drivers/out/tera/books/rockbook.ly.tera"]

[processor.explicit.guitar_album_driver]
command = "python"
args = ["-m", "scripts.drivers", "book"]
inputs = ["src/include/common.ly.weave", "scripts/drivers.py"]
input_globs = ["out/derived/guitar_album/**/*.ly.toml"]
output_files = ["out/drivers/out/tera/books/guitar_album.ly.tera"]

# ─── books ───────────────────────────────────────────────────────────────────

# Compile the tera-rendered book sources with lilypond. Each book is one
# explicit product whose .ly input is a tera-processor output, so rsconstruct
# orders tera before lilypond automatically and rebuilds a book only when its
# rendered source changes.
[processor.explicit.openbook]
command = "python"
args = ["-m", "scripts.wrapper_lilypond_explicit"]
inputs = ["out/tera/books/openbook.ly"]
output_files = ["out/tera/books/openbook.pdf", "out/tera/books/openbook.ps"]

# forScore index.csv for the openbook PDF (issue #121): one bookmark per tune
# when imported into the forScore iPad app. Page numbers are read from the
# book's rendered table of contents by scripts.gen_index_csv.
[processor.explicit.openbook_index_csv]
command = "python"
args = ["-m", "scripts.gen_index_csv"]
inputs = ["out/tera/books/openbook.pdf"]
output_files = ["out/tera/books/openbook.csv"]

[processor.explicit.israeli]
command = "python"
args = ["-m", "scripts.wrapper_lilypond_explicit"]
inputs = ["out/tera/books/israeli.ly"]
output_files = ["out/tera/books/israeli.pdf", "out/tera/books/israeli.ps"]

[processor.explicit.drumming]
command = "python"
args = ["-m", "scripts.wrapper_lilypond_explicit"]
inputs = ["out/tera/books/drumming.ly"]
output_files = ["out/tera/books/drumming.pdf", "out/tera/books/drumming.ps"]

[processor.explicit.rockbook]
command = "python"
args = ["-m", "scripts.wrapper_lilypond_explicit"]
inputs = ["out/tera/books/rockbook.ly"]
output_files = ["out/tera/books/rockbook.pdf", "out/tera/books/rockbook.ps"]

[processor.explicit.guitar_album]
command = "python"
args = ["-m", "scripts.wrapper_lilypond_explicit"]
inputs = ["out/tera/books/guitar_album.ly"]
output_files = ["out/tera/books/guitar_album.pdf", "out/tera/books/guitar_album.ps"]

# ─── github pages ────────────────────────────────────────────────────────────

# The website is the docs/ tree as built: the tera-rendered
# docs/index.html and the freshly engraved books copied to docs/output/
# below — index.html links them as output/<book>.{pdf,ps,ly} and the
# browser's native PDF viewer displays them. CI uploads this directory
# as the Pages artifact; docs/output and docs/index.html are generated,
# not committed.
[pages]
dir = "docs"

# copy the engraved books into the website tree, one product per file
[processor.generator.pages_books_pdf]
command = "cp"
src_dirs = ["out/tera/books"]
src_extensions = [".pdf"]
output_dir = "docs/output"
output_extension = "pdf"
batch = false

[processor.generator.pages_books_ps]
command = "cp"
src_dirs = ["out/tera/books"]
src_extensions = [".ps"]
output_dir = "docs/output"
output_extension = "ps"
batch = false

[processor.generator.pages_books_ly]
command = "cp"
src_dirs = ["out/tera/books"]
src_extensions = [".ly"]
output_dir = "docs/output"
output_extension = "ly"
batch = false

# publish the forScore index.csv to the site so it can be downloaded from
# the gh-pages site alongside the PDFs
[processor.generator.pages_books_csv]
command = "cp"
src_dirs = ["out/tera/books"]
src_extensions = [".csv"]
output_dir = "docs/output"
output_extension = "csv"
batch = false

# ─── external dependencies ───────────────────────────────────────────────────

# lilypond engraves the books; installed by `rsconstruct tools install-deps`
[dependencies]
system = ["lilypond", "tidy"]

# ─── opt-in targets (disabled by default) ────────────────────────────────────

# Migrated from the Makefile targets that were not part of `make all`.
# Each stanza ships with enabled = false; activate one for a single build
# from the command line without touching this file:
#
#   rsconstruct build --iset explicit.check_all.enabled=true
#   rsconstruct build --iset generator.songs_pdf.enabled=true
#
# The per-song and audio processors scan generated trees (out/tera/src,
# out/songs/midi), so they discover work only once a prior build has
# produced those files: run a plain `rsconstruct build` first.

# source-convention checks on the song sources; part of the default
# build since 2026-09-01, when its findings were all fixed
[processor.explicit.check_all]
command = "python"
args = ["-m", "scripts.check_all"]
inputs = ["scripts/check_all.py"]
input_globs = ["src/**/*.ly.tera"]
output_files = ["out/checks/check_all.stamp"]

# validate the generated website index page (part of the default build)
[processor.tidy]
src_dirs = ["docs"]
args = ["-errors", "-q", "-utf8"]

[processor.htmlhint]
enabled = false
src_dirs = ["docs"]

# per-song engraving (DO_PDF / DO_PS / DO_MIDI): one product per rendered song
[processor.generator.songs_pdf]
enabled = false
command = "python"
args = ["-m", "scripts.wrapper_lilypond_song"]
src_dirs = ["out/tera/src"]
src_extensions = [".ly"]
output_dir = "out/songs/pdf"
output_extension = "pdf"
dep_inputs = ["scripts/wrapper_lilypond_song.py"]
required_tools = ["lilypond"]
batch = false

[processor.generator.songs_ps]
enabled = false
command = "python"
args = ["-m", "scripts.wrapper_lilypond_song"]
src_dirs = ["out/tera/src"]
src_extensions = [".ly"]
output_dir = "out/songs/ps"
output_extension = "ps"
dep_inputs = ["scripts/wrapper_lilypond_song.py"]
required_tools = ["lilypond"]
batch = false

[processor.generator.songs_midi]
enabled = false
command = "python"
args = ["-m", "scripts.wrapper_lilypond_song"]
src_dirs = ["out/tera/src"]
src_extensions = [".ly"]
output_dir = "out/songs/midi"
output_extension = "midi"
dep_inputs = ["scripts/wrapper_lilypond_song.py"]
required_tools = ["lilypond"]
batch = false

# audio rendering (DO_WAV / DO_OGG / DO_MP3): consumes the songs_midi outputs
[processor.generator.midi2wav]
enabled = false
command = "python"
args = ["-m", "scripts.wrapper_midi_audio"]
src_dirs = ["out/songs/midi"]
src_extensions = [".midi"]
output_dir = "out/songs/wav"
output_extension = "wav"
dep_inputs = ["scripts/wrapper_midi_audio.py"]
required_tools = ["timidity"]
batch = false

[processor.generator.midi2ogg]
enabled = false
command = "python"
args = ["-m", "scripts.wrapper_midi_audio"]
src_dirs = ["out/songs/midi"]
src_extensions = [".midi"]
output_dir = "out/songs/ogg"
output_extension = "ogg"
dep_inputs = ["scripts/wrapper_midi_audio.py"]
required_tools = ["timidity"]
batch = false

[processor.generator.midi2mp3]
enabled = false
command = "python"
args = ["-m", "scripts.wrapper_midi_audio"]
src_dirs = ["out/songs/midi"]
src_extensions = [".midi"]
output_dir = "out/songs/mp3"
output_extension = "mp3"
dep_inputs = ["scripts/wrapper_midi_audio.py"]
required_tools = ["timidity", "lame"]
batch = false

# `make real_books_archive.gi`: fetch the scanned real-books reference archive
[processor.explicit.real_books]
enabled = false
command = "python"
args = ["-m", "scripts.download_real_books"]
inputs = ["scripts/download_real_books.py"]
output_files = ["out/real_books/real_books.stamp"]

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_files = ["README.md"]
