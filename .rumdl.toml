# Markdown lint rules, shared fleet-wide (rsmultigit check same). Carried
# over from the pydmt-era .markdownlint.json / .mdl.style.rb configs the
# repos were maintained against: rules those never addressed stay on.

# MD057 (existing-relative-links) is on: a relative link must name a file
# that exists. Slide decks are linted with .rumdl.marp.toml instead, which
# also resolves links from the project root: that is where Marp addresses
# images from, not from the file that holds the link.
# MD053 (unused-link-image-reference) is on: a comment is written
# <!-- ... -->, not as the [//1]: <> (...) reference idiom. demos-lang-md,
# which teaches that idiom, marks those lines per line.
# MD014 (commands-show-output) wants a shell example either to show its
# output or to drop the "$" prompt. The prompt is deliberate in these
# repos: it separates the command from its output and marks the shell
# being used (a Windows example uses ">"), so the rule's fix would
# rewrite authored teaching material. Kept off fleet-wide.
# Rules rumdl leaves off unless asked for, enabled here:
# MD070 (nested-code-fence): a fenced block that shows a fence is written
# with a longer outer fence, so the inner one cannot close it.
# MD075 (orphaned table rows), MD081 (excessive emphasis), MD083 (mojibake),
# MD091 (Markdown inside an HTML block, which renders as literal text).
# MD087: an inline disable comment must suppress something, the Markdown
# side of the fleet's rule that every suppression is needed and says why.
# MD060 (table-format): a table whose columns are padded is padded the
# same way in every row.
# MD084 (invisible characters): no zero-width or other unseen character,
# except the two declared under [MD084] below.
# MD085: the lines of a paragraph are not indented. An indented outline is
# written as the list or the code block it is.
# MD088: quotes are the ASCII ones, not the typographic pairs.
# MD072: the keys of a page's front matter are in alphabetical order.
# MD080: no two headings of a page have the same anchor. A sub-heading
# that repeats under several parents carries its parent's name.
# MD082: a heading has text under it. A heading whose content is its
# sub-headings is allowed ([MD082] below).
# MD063 (heading capitalization) stays off, by decision (2026-11-27). What
# it would write is often wrong: it breaks compound tokens (I/O to I/o,
# C/C++ to C/c++), capitalises identifiers and file names (mmap() to
# Mmap(), main.tf to Main.tf), and applies English title case to the
# Russian and Hebrew pages. Passing it would take an ignore list of
# hundreds of words here.
[global]
disable = ["MD014"]
extend-enable = ["MD060", "MD070", "MD072", "MD075", "MD080", "MD081", "MD082", "MD083", "MD084", "MD085", "MD087", "MD088", "MD091"]

# MD033 (no-inline-html) is on, allowing only the elements Markdown has no
# syntax for and the fleet's pages need: Marp slide layouts (div), images
# sized or styled (img), charts and diagrams drawn in the page (script, svg,
# canvas), collapsible sections (details, summary), superscript (sup), and
# left-to-right runs inside Hebrew text (bdi). Any other element is reported.
[MD033]
allowed_elements = ["bdi", "canvas", "details", "div", "img", "script", "summary", "sup", "svg"]

# The left-to-right and right-to-left marks are written on purpose in the
# Hebrew pages: they keep a list of Latin names, or a number with its
# sign, in reading order inside right-to-left text.
[MD084]
allow = ["U+200E", "U+200F"]

[MD082]
allow-parent-headings = true

[MD007]
indent = 4

# MD013 (line-length) is effectively off: prose is written one paragraph (or
# one slide bullet) per line on purpose. Markdown joins wrapped lines anyway,
# so the rendered slides, PDFs and pages are the same either way, while hard
# wrapping would make a one-word edit rewrap, and show as changed, every
# line after it. One line per paragraph keeps a change to one line.
[MD013]
line_length = 1000
