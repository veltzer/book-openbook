# Lets `uv sync` install this repo's Python dependencies.

[project]
name = "book-openbook"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "requests",
    "pypdf",
]

[dependency-groups]
dev = [
    "pyrefly",
    "pytest",
    "ruff",
    "types-requests",
]

[tool.uv]
# Demo/teaching repo: not an installable package.
package = false

[tool.pytest.ini_options]
# the tests import scripts.* from the repository root
pythonpath = ["."]

[tool.pyrefly]
# Type checking (rsconstruct's pyrefly processor). preset = "legacy" is
# pyrefly's mypy-compatible behavior; "." on the search path is mypy's
# implicit current directory.
preset = "legacy"
search-path = [
    ".",
]
